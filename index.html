<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeerJS Multiplayer Game</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin-top: 20px; 
            background: #121212; 
            color: #e0e0e0; 
        }
        canvas { 
            background: #2a2a2a; 
            display: block; 
            margin: 20px auto; 
            border: 2px solid #4caf50; 
            border-radius: 8px;
        }
        .controls { 
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 20px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        input, button { 
            padding: 10px; 
            margin: 5px; 
            font-size: 16px; 
            border: none;
            border-radius: 4px;
        }
        input { background: #333; color: #fff; }
        button { 
            background: #4caf50; 
            color: white; 
            cursor: pointer; 
            font-weight: bold;
        }
        button:hover { background: #45a049; }
        #my-id { color: #4caf50; font-family: monospace; font-size: 18px; }
        #status { font-style: italic; color: #aaa; margin-top: 15px;}
    </style>
</head>
<body>
    <h2>WebRTC Real-Time Multiplayer</h2>
    
    <div class="controls">
        <p>Your ID: <strong id="my-id">Connecting to signaling server...</strong></p>
        <input type="text" id="join-id" placeholder="Enter Friend's ID">
        <button id="connect-btn">Connect & Play</button>
        <p id="status">Status: Waiting for connection...</p>
    </div>

    <canvas id="gameCanvas" width="500" height="400"></canvas>

    <!-- Import PeerJS for serverless WebRTC -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        // --- FULL FILE IMPLEMENTATION ---
        
        // 1. Initialize PeerJS
        const peer = new Peer();
        let connection = null;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Player states
        let myPos = { x: 50, y: 50, color: '#4caf50' }; // Green
        let peerPos = { x: 430, y: 330, color: '#f44336' }; // Red

        // Setup local peer and get ID
        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
        });

        // Handle incoming connection (If you are the Host)
        peer.on('connection', (conn) => {
            connection = conn;
            setupConnection();
        });

        // Connect to a friend (If you are the Client joining)
        document.getElementById('connect-btn').addEventListener('click', () => {
            const friendId = document.getElementById('join-id').value;
            if (!friendId) return;
            connection = peer.connect(friendId);
            setupConnection();
        });

        // Configure the active connection
        function setupConnection() {
            connection.on('open', () => {
                document.getElementById('status').innerText = 'Status: Connected! Click here and use Arrow Keys to move.';
                document.getElementById('status').style.color = '#4caf50';
            });

            // Receive movement data from the other player
            connection.on('data', (data) => {
                peerPos.x = data.x;
                peerPos.y = data.y;
            });
            
            connection.on('close', () => {
                document.getElementById('status').innerText = 'Status: Disconnected.';
                document.getElementById('status').style.color = '#f44336';
                connection = null;
            });
        }

        // Game Loop & Input handling
        document.addEventListener('keydown', (e) => {
            // Prevent default scrolling for arrow keys
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }

            if (!connection || !connection.open) return;
            
            const speed = 15;
            if (e.key === 'ArrowUp') myPos.y = Math.max(0, myPos.y - speed);
            if (e.key === 'ArrowDown') myPos.y = Math.min(canvas.height - 20, myPos.y + speed);
            if (e.key === 'ArrowLeft') myPos.x = Math.max(0, myPos.x - speed);
            if (e.key === 'ArrowRight') myPos.x = Math.min(canvas.width - 20, myPos.x + speed);

            // Send my new position to the peer
            connection.send({ x: myPos.x, y: myPos.y });
        });

        // Render everything
        function draw() {
            // Clear previous frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw My Player
            ctx.fillStyle = myPos.color;
            ctx.fillRect(myPos.x, myPos.y, 20, 20);

            // Draw Peer Player (only if connected)
            if (connection && connection.open) {
                ctx.fillStyle = peerPos.color;
                ctx.fillRect(peerPos.x, peerPos.y, 20, 20);
            }
            
            requestAnimationFrame(draw);
        }
        
        // Start the render loop
        draw();
    </script>
</body>
</html>
